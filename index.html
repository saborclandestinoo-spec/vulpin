<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Studio</title>
<meta name="theme-color" content="#F2F2F7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Studio">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230B0B0F'/%3E%3Crect x='22' y='22' width='20' height='20' rx='6' fill='%232563EB'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --fill:#EEEEF3; --fill-2:#E4E4EA; --line:#E9E9EE;
  --txt:#0B0B0F; --txt-2:#6B6B76; --txt-3:#A3A3AD;
  --blue:#2563EB; --blue-2:#1D4ED8; --blue-soft:#E8EFFD;
  --red:#FF3B30; --yellow:#FFB800; --orange:#FF7A00; --green:#00B368;
  --r:22px; --r-m:16px; --r-s:12px;
  --sh:0 1px 2px rgba(10,10,20,.04),0 10px 28px -14px rgba(10,10,20,.12);
  --sh-lg:0 30px 80px -20px rgba(10,10,20,.35);
  --e:cubic-bezier(.22,1,.36,1);
  --tab:0px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Poppins',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;font-size:15px;overflow:hidden}
button{font-family:inherit}
::selection{background:var(--blue);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#D9D9DF;border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.hide{display:none!important}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:260px 1fr;height:100vh;height:100dvh}
.rail{display:flex;flex-direction:column;gap:6px;padding:22px 16px;border-right:1px solid var(--line);background:rgba(255,255,255,.6)}
.brand{display:flex;align-items:center;gap:11px;padding:4px 10px 18px}
.logo{width:34px;height:34px;border-radius:11px;background:var(--txt);position:relative;flex:none}
.logo::after{content:'';position:absolute;inset:11px;border-radius:4px;background:var(--blue)}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.03em}
.newbtn{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:#fff;
  font-weight:600;font-size:14.5px;padding:13px;border-radius:14px;margin-bottom:14px;transition:.15s;box-shadow:0 6px 16px -6px rgba(37,99,235,.55)}
.newbtn:hover{background:var(--blue-2)}
.newbtn svg{width:18px;height:18px;stroke-width:2.6}
.rail nav{display:flex;flex-direction:column;gap:2px}
.rail nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;
  font-size:15px;font-weight:500;color:var(--txt-2);transition:background .15s,color .15s}
.rail nav button svg{width:21px;height:21px;stroke-width:1.9;flex:none}
.rail nav button:hover{background:var(--fill);color:var(--txt)}
.rail nav button.on{background:var(--card);color:var(--txt);font-weight:600;box-shadow:var(--sh)}
.rail nav button.on svg{color:var(--blue)}
.nb{margin-left:auto;min-width:22px;height:22px;border-radius:99px;padding:0 7px;background:var(--red);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center}
.nb:empty{display:none}
.me{all:unset;cursor:pointer;margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;transition:.15s}
.me:hover{background:var(--fill)}
.av{width:34px;height:34px;border-radius:50%;background:var(--txt);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center;flex:none;text-transform:uppercase}
.me b{display:block;font-size:13px;font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me small{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--txt-3)}
.me small i,.sync i{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none}

.main{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.view{display:none;max-width:860px;margin:0 auto;padding:34px 32px 80px;animation:fade .35s var(--e)}
.view.on{display:block}
#v-cal.on{max-width:1240px}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}

/* ---------- headers ---------- */
.hd{display:flex;align-items:flex-end;gap:12px;margin-bottom:22px}
.hd .sub{font-size:14px;font-weight:500;color:var(--txt-2);margin-bottom:2px}
.hd h1{font-size:34px;font-weight:800;letter-spacing:-.045em;line-height:1.1}
.hd h1 small{font-size:17px;font-weight:600;color:var(--txt-3);letter-spacing:-.02em;margin-left:6px}
.hd .av{all:unset;display:none;cursor:pointer;width:38px;height:38px;border-radius:50%;background:var(--txt);color:#fff;font-weight:700;font-size:15px;
  place-items:center;text-transform:uppercase;margin-left:auto;flex:none}
.hd-act{margin-left:auto;display:flex;gap:8px;align-items:center}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:20px;margin-bottom:14px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card-h .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;flex:none}
.card-h h2{font-size:18px;font-weight:700;letter-spacing:-.025em}
.card-h .n{font-size:13px;font-weight:600;color:var(--txt-3)}
.card-h .lnk{all:unset;cursor:pointer;margin-left:auto;font-size:14px;font-weight:600;color:var(--blue)}
.card-f{font-size:13px;color:var(--txt-2);margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.tile{all:unset;cursor:pointer;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;transition:.15s;display:block}
.tile:hover{transform:translateY(-2px)}
.tile:active{transform:scale(.98)}
.tile .ic{font-size:22px}
.tile b{display:block;font-size:30px;font-weight:800;letter-spacing:-.04em;margin-top:10px;line-height:1}
.tile span{font-size:13.5px;color:var(--txt-2);font-weight:500}

/* ---------- rows / lists ---------- */
.row{display:flex;align-items:center;gap:13px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .tx{flex:1;min-width:0;cursor:pointer}
.row .tx p{font-size:15.5px;font-weight:600;letter-spacing:-.01em;line-height:1.35;word-break:break-word}
.row .tx small{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;color:var(--txt-3);margin-top:3px}
.row.done .tx p{text-decoration:line-through;color:var(--txt-3)}
.chk{all:unset;cursor:pointer;flex:none;width:28px;height:28px;border-radius:50%;border:2px solid #CFCFD6;display:grid;place-items:center;transition:.15s}
.chk svg{width:15px;height:15px;stroke:#fff;stroke-width:3.2;opacity:0}
.chk:hover{border-color:var(--green)}
.chk.on{background:var(--green);border-color:var(--green);animation:popc .3s var(--e)}
.chk.on svg{opacity:1}
@keyframes popc{50%{transform:scale(1.18)}}
.dbox{width:46px;height:48px;flex:none;border-radius:13px;background:var(--fill);display:flex;flex-direction:column;align-items:center;justify-content:center}
.dbox b{font-size:17px;font-weight:700;line-height:1}
.dbox i{font-style:normal;font-size:10px;font-weight:700;color:var(--txt-3);margin-top:3px;letter-spacing:.04em}
.kb{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.late{color:var(--red);font-weight:600}
.empty{text-align:center;padding:28px 12px 10px;color:var(--txt-2)}
.empty .em{font-size:34px;margin-bottom:8px}
.empty b{display:block;font-size:16px;font-weight:700;color:var(--txt);margin-bottom:4px}
.empty p{font-size:14px;line-height:1.5}
.empty .btn{margin-top:14px}

/* ---------- buttons / controls ---------- */
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 18px;border-radius:13px;
  font-size:14.5px;font-weight:600;transition:.15s;white-space:nowrap;box-sizing:border-box}
.btn-blue{background:var(--blue);color:#fff}
.btn-blue:hover{background:var(--blue-2)}
.btn-soft{background:var(--fill);color:var(--txt)}
.btn-soft:hover{background:var(--fill-2)}
.btn-red{background:var(--red);color:#fff}
.btn:disabled,.btn[disabled]{opacity:.35;pointer-events:none}
.btn-sm{padding:8px 13px;font-size:13.5px;border-radius:11px}
.btn svg{width:17px;height:17px;stroke-width:2.4}
.seg{display:flex;gap:2px;background:var(--fill);padding:3px;border-radius:12px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{all:unset;cursor:pointer;flex:1;text-align:center;padding:8px 14px;border-radius:10px;font-size:14px;font-weight:500;color:var(--txt-2);white-space:nowrap;transition:.15s}
.seg button.on{background:var(--card);color:var(--txt);font-weight:600;box-shadow:0 1px 3px rgba(10,10,20,.1)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px;margin-bottom:14px}
.chips::-webkit-scrollbar{display:none}
.chip{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;background:var(--card);
  font-size:13.5px;font-weight:500;color:var(--txt-2);white-space:nowrap;box-shadow:inset 0 0 0 1px var(--line);transition:.15s;flex:none}
.chip.on{background:var(--txt);color:#fff;box-shadow:none;font-weight:600}
.chip.add{color:var(--blue);background:transparent;box-shadow:none;border:1.5px dashed #B9C9F5;padding:6.5px 13px}
.chip input{all:unset;width:120px;font-size:13.5px;color:var(--txt)}
.searchbox{display:flex;align-items:center;gap:9px;background:var(--fill);border-radius:13px;padding:10px 14px;margin-bottom:14px}
.searchbox svg{width:17px;height:17px;stroke:var(--txt-3);stroke-width:2.2;flex:none}
.searchbox input{all:unset;flex:1;font-size:15px;color:var(--txt);min-width:0}
.searchbox input::placeholder{color:var(--txt-3)}

/* ---------- ideias ---------- */
.ilist{display:flex;flex-direction:column;gap:10px}
.icard{background:var(--card);border-radius:20px;box-shadow:var(--sh);padding:16px 18px;cursor:pointer;transition:.15s;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.icard:hover{transform:translateY(-1px)}
.icard:active{transform:scale(.99)}
.icard .top{display:flex;align-items:center;gap:7px;margin-bottom:9px;flex-wrap:wrap}
.icard h3{font-size:17px;font-weight:700;letter-spacing:-.02em;line-height:1.3;word-break:break-word}
.icard .pv{font-size:14px;color:var(--txt-2);line-height:1.5;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.icard .ft{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--txt-3);margin-top:11px;font-weight:500}
.spill{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:4px 11px 4px 9px;border-radius:99px;transition:.12s}
.spill i{width:7px;height:7px;border-radius:50%}
.spill:active{transform:scale(.93)}
.tp{font-size:12px;font-weight:600;color:var(--txt-2);background:var(--fill);padding:3px 9px;border-radius:99px}

/* ---------- gravar ---------- */
.rbar{display:flex;gap:10px;align-items:center;margin-bottom:22px;flex-wrap:wrap}
.rbar .seg{flex:0 1 330px}
.rday{margin-bottom:24px}
.rday-h{display:flex;align-items:baseline;gap:9px;margin:0 4px 10px}
.rday-h h3{font-size:20px;font-weight:800;letter-spacing:-.03em}
.rday-h .w{font-size:13px;font-weight:600;color:var(--txt-3)}
.rday-h .ld{margin-left:auto;font-size:13px;font-weight:500;color:var(--txt-2)}
.rday-h.hoje h3,.rday-h.hoje .w{color:var(--blue)}
.rday-h.atr h3,.rday-h.atr .w{color:var(--red)}
.rset{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:6px 18px;margin-bottom:10px}
.rset-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:12px 0 6px}
.rset-h i{font-style:normal;margin-left:auto;font-weight:500;color:var(--txt-3);font-size:12.5px}
.racts{display:flex;gap:6px;flex:none;align-items:center}
.datechip{all:unset;cursor:pointer;position:relative;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:11px;background:var(--fill);
  font-size:13px;font-weight:600;color:var(--txt);white-space:nowrap;transition:.15s}
.datechip:hover{background:var(--fill-2)}
.datechip.empty-d{color:var(--txt-2);font-weight:500}
.datechip input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;font-size:16px}
.xbtn{all:unset;cursor:pointer;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:var(--txt-3);flex:none}
.xbtn:hover{background:var(--fill);color:var(--red)}
.xbtn svg{width:15px;height:15px;stroke-width:2.4}

/* ---------- agenda ---------- */
.cal-wrap{display:grid;grid-template-columns:1fr 270px;gap:22px;align-items:start}
.cal-top{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.cal-top h2{font-size:24px;font-weight:800;letter-spacing:-.035em;text-transform:capitalize;margin-right:auto}
.rnd{all:unset;cursor:pointer;width:38px;height:38px;border-radius:12px;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;transition:.15s}
.rnd:hover{background:var(--fill)}
.rnd svg{width:17px;height:17px;stroke-width:2.4}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow{font-size:12.5px;font-weight:600;color:var(--txt-3);text-align:center;padding-bottom:3px}
.day{height:132px;border-radius:14px;background:var(--card);padding:7px;display:flex;flex-direction:column;gap:4px;overflow:hidden;cursor:pointer;
  transition:.15s;border:2px solid transparent;box-shadow:0 1px 2px rgba(10,10,20,.03)}
.day:hover{box-shadow:var(--sh)}
.day.out{background:transparent;box-shadow:none;cursor:default;opacity:.4}
.day.drop{border-color:var(--blue)!important;background:var(--blue-soft)!important}
.dn{display:flex;align-items:center;min-height:24px}
.dn b{font-size:13px;font-weight:600;color:var(--txt-2);min-width:24px;height:24px;display:grid;place-items:center;border-radius:99px}
.day.today .dn b{background:var(--blue);color:#fff}
.dn .plus{all:unset;cursor:pointer;margin-left:auto;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;color:var(--txt-3);font-size:18px;opacity:0;transition:.12s}
.day:hover .plus{opacity:1}
.dn .plus:hover{background:var(--blue-soft);color:var(--blue)}
.pills{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:3px}
.pills::-webkit-scrollbar{display:none}
.pill{flex:1 1 auto;min-height:0;font-size:12px;font-weight:600;line-height:1.3;padding:5px 7px;border-radius:8px;
  background:rgba(255,255,255,.95);color:var(--txt);border-left:3px solid var(--blue);
  white-space:normal;word-break:normal;overflow-wrap:normal;overflow:hidden;cursor:grab;
  box-shadow:0 1px 2px rgba(10,10,20,.08);-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.seg.plat button small{font-size:11px;font-weight:500;color:var(--txt-3);margin-left:5px}
.pill.drag{opacity:.4}
.cal-scroll{display:flex;flex-direction:column;gap:30px;max-height:calc(100dvh - 190px);overflow-y:auto;padding-right:4px}
.cal-block h3{font-size:19px;font-weight:800;letter-spacing:-.03em;text-transform:capitalize;margin-bottom:10px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:2}
.tray{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;position:sticky;top:0}
.tray h3{font-size:16px;font-weight:700;letter-spacing:-.02em}
.tray > p{font-size:13px;color:var(--txt-3);margin:3px 0 12px;line-height:1.45}
.tray.drop{box-shadow:0 0 0 2px var(--blue)}
.titem{background:var(--fill);border-radius:12px;padding:10px 12px;margin-bottom:7px;cursor:grab;-webkit-user-select:none;user-select:none}
.titem p{font-size:13.5px;font-weight:600;line-height:1.35}
.titem small{font-size:12px;color:var(--txt-3)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:12.5px;color:var(--txt-2);font-weight:500}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px}

/* ---------- sheet (modal) ---------- */
.veil{position:fixed;inset:0;z-index:80;background:rgba(10,10,20,.3);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;
  align-items:center;justify-content:center;padding:24px}
.veil.on{display:flex;animation:fi .2s ease}
@keyframes fi{from{opacity:0}}
.sheet{width:100%;max-width:620px;max-height:calc(100dvh - 48px);background:var(--card);border-radius:26px;box-shadow:var(--sh-lg);
  display:flex;flex-direction:column;overflow:hidden;animation:rise .35s var(--e)}
.sheet.sm{max-width:460px}
@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.98)}}
.sh-top{display:flex;align-items:center;gap:8px;padding:14px 16px 6px}
.sh-top .grab{display:none}
.sh-top h4{flex:1;text-align:center;font-size:15px;font-weight:600;color:var(--txt-2)}
.tbtn{all:unset;cursor:pointer;font-size:15.5px;font-weight:500;color:var(--blue);padding:8px 10px;border-radius:10px;min-width:70px}
.tbtn.r{text-align:right;font-weight:700}
.tbtn:hover{background:var(--blue-soft)}
.sh-body{padding:4px 22px 18px;overflow-y:auto;flex:1}
.ed-title{all:unset;display:block;width:100%;box-sizing:border-box;font-size:25px;font-weight:700;letter-spacing:-.03em;line-height:1.25;color:var(--txt);padding:6px 0 4px;white-space:pre-wrap;word-break:break-word;resize:none;overflow:hidden}
.ed-title::placeholder{color:#C5C5CD}
.ed-notes{all:unset;display:block;width:100%;box-sizing:border-box;min-height:200px;font-size:16px;line-height:1.7;color:var(--txt);padding:8px 0;white-space:pre-wrap;word-break:break-word;resize:none}
.ed-notes::placeholder{color:#B5B5BD}
.ed-chips{display:flex;gap:8px;flex-wrap:wrap;padding:14px 22px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#FAFAFC}
.echip{position:relative;display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:12px;background:var(--card);
  box-shadow:inset 0 0 0 1px var(--line);font-size:13.5px;font-weight:600;color:var(--txt);white-space:nowrap;cursor:pointer}
.echip small{font-weight:500;color:var(--txt-3)}
.echip select,.echip input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;font-size:16px}
.echip.empty-d{color:var(--txt-2);font-weight:500}
.ed-chips .xbtn{width:38px;height:38px;margin-left:-6px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);border-radius:12px}
.del-ed{all:unset;cursor:pointer;color:var(--red);font-size:14px;font-weight:600;padding:9px 12px;border-radius:12px;margin-left:auto}
.del-ed:hover{background:#FFEDEC}

/* conta */
.grp{background:var(--fill);border-radius:18px;overflow:hidden;margin-bottom:16px}
.grp-l{font-size:13px;font-weight:600;color:var(--txt-3);margin:18px 6px 8px}
.gi{display:flex;align-items:center;gap:12px;padding:13px 16px;font-size:15px;border-top:1px solid #E2E2E8;background:var(--card)}
.gi:first-child{border-top:0}
.gi b{font-weight:600}
.gi .r{margin-left:auto;color:var(--txt-3);font-size:14px}

.wipe .btn{width:100%}

/* ---------- gate ---------- */
.gate{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.gate.on{display:flex}
.gbox{width:100%;max-width:390px;background:var(--card);border-radius:28px;box-shadow:var(--sh);padding:32px 26px}
.gbox .logo{width:48px;height:48px;border-radius:15px;margin-bottom:22px}
.gbox .logo::after{inset:15px;border-radius:5px}
.gbox h2{font-size:28px;font-weight:800;letter-spacing:-.04em;line-height:1.15;margin-bottom:6px}
.gbox .sub{font-size:14.5px;color:var(--txt-2);margin-bottom:22px;line-height:1.5}
.gbox .seg{margin-bottom:16px}
.gin{all:unset;display:block;width:100%;box-sizing:border-box;background:var(--fill);border-radius:13px;padding:14px 16px;font-size:16px;margin-bottom:10px;color:var(--txt)}
.gin:focus{box-shadow:inset 0 0 0 2px var(--blue);background:#fff}
.gin::placeholder{color:var(--txt-3)}
.gerr{display:none;font-size:13.5px;color:#B42318;background:#FFF1F0;border-radius:12px;padding:11px 13px;margin-bottom:12px;line-height:1.45}
.gbox .btn{width:100%;padding:15px;font-size:16px;margin-top:6px}

/* ---------- toast / fab / tabbar ---------- */
.toast{display:flex;align-items:center;position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);z-index:130;background:var(--txt);color:#fff;padding:12px 18px;
  border-radius:14px;font-size:14px;font-weight:500;box-shadow:var(--sh-lg);opacity:0;visibility:hidden;transition:.3s var(--e);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;visibility:visible;transform:translate(-50%,0)}
.tabbar,.fab{display:none}

.selbtn{all:unset;cursor:pointer;font-size:15px;font-weight:600;color:var(--blue);padding:8px 12px;border-radius:11px;margin-left:auto}
.selbtn:hover{background:var(--blue-soft)}
.hd .selbtn + .av{margin-left:6px}
.icard{position:relative}
.icard .sel{display:none;position:absolute;top:16px;right:16px;width:26px;height:26px;border-radius:50%;border:2px solid #CFCFD6;background:#fff;place-items:center}
.icard .sel svg{width:14px;height:14px;stroke:#fff;stroke-width:3.2;opacity:0}
body.selecting .icard .sel{display:grid}
body.selecting .icard{padding-right:56px}
body.selecting .icard .spill{pointer-events:none}
.icard.picked{box-shadow:0 0 0 2.5px var(--blue),var(--sh);background:#F7FAFF}
.icard.picked .sel{background:var(--blue);border-color:var(--blue)}
.icard.picked .sel svg{opacity:1}
.selbar{position:fixed;left:50%;bottom:24px;transform:translate(-50%,140%);z-index:70;width:min(760px,calc(100% - 32px));
  background:var(--txt);color:#fff;border-radius:22px;box-shadow:var(--sh-lg);padding:12px;transition:transform .35s var(--e);visibility:hidden}

.selbar-h{display:flex;align-items:center;gap:10px;padding:0 4px 10px}
.selbar-h b{font-size:15px;font-weight:700;white-space:nowrap}
.selbar-h button{white-space:nowrap}
body.selecting #v-ideias{padding-bottom:200px}
.selbar-h button{all:unset;cursor:pointer;font-size:14px;font-weight:600;color:#9DB8FF;padding:4px 8px;border-radius:8px}

.selbar-h .x{margin-left:auto;color:#fff}
.selacts{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}

.sa{position:relative;flex:none;display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:13px;background:rgba(255,255,255,.12);

.sa:hover{background:rgba(255,255,255,.2)}
.sa select{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:16px}
.sa.del{background:rgba(255,59,48,.9)}
.sa.del:hover{background:var(--red)}
.sa.off{opacity:.35;pointer-events:none}
.hiddate{position:fixed;left:-9999px;top:0;opacity:0;width:1px;height:1px}
.toast button{all:unset;cursor:pointer;margin-left:14px;font-weight:700;color:#9DB8FF}
body.selecting .fab{display:none}

const fmtD=ds=>{if(!ds)return '';const[,m,d]=ds.split('-');return d+'/'+m};
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hhmm=m=>m>=60?(Math.floor(m/60)+'h'+(m%60?String(m%60).padStart(2,'0'):'')):(m+'min');
const stage=id=>STAGES.find(s=>s.id===id)||STAGES[0];
const fmtOf=i=>FORMATS.find(f=>f.v===i.format)||FORMATS[0];
const kindOf=i=>fmtOf(i).k;
const kindOb=i=>KINDS[kindOf(i)];
const topic=id=>topics.find(t=>t.id===id)||null;
// YouTube = vídeo longo · Instagram = vídeo curto (Reel, Short, Story, Carrossel)
const platOf=i=>fmtOf(i).k==='video'?'yt':'ig';
const PLATS=[{id:'all',n:'Todos'},{id:'yt',n:'YouTube',c:'#FF0033'},{id:'ig',n:'Instagram',c:'#2563EB'}];
const platOk=(i,f)=>f==='all'||platOf(i)===f;
function platSeg(sel,cur,onPick){
  const el=$(sel);
  el.innerHTML=PLATS.map(x=>`<button data-pl="${x.id}" class="${cur===x.id?'on':''}">${x.c?`<i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${x.c};margin-right:6px;vertical-align:1px"></i>`:''}${x.n}${x.id!=='all'?`<small>${x.id==='yt'?'longo':'curto'}</small>`:''}</button>`).join('');
  el.querySelectorAll('[data-pl]').forEach(b=>b.onclick=()=>onPick(b.dataset.pl));
}
const needsRec=i=>kindOf(i)!=='estatico'&&(i.status==='ideia'||i.status==='gravacao');
const kbHTML=i=>{const K=kindOb(i);return `<span class="kb" style="background:${K.c}14;color:${K.c}">${K.ic} ${esc(fmtOf(i).n)}</span>`};
function toast(m,act,fn){const t=$('#toast');t.textContent=m;
  if(act){const b=document.createElement('button');b.textContent=act;b.onclick=()=>{t.classList.remove('on');fn()};t.appendChild(b);}
  t.classList.add('on');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('on'),act?6000:2300)}
function relDay(ds){const t=today(); if(ds===t)return 'hoje'; if(ds===dShift(t,1))return 'amanhã'; if(ds===dShift(t,-1))return 'ontem';
  return DOWL[new Date(ds+'T12:00').getDay()];}

/* ===================== SUPABASE ===================== */
const _mem={};
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return k in _mem?_mem[k]:null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){_mem[k]=v}}, del(k){try{localStorage.removeItem(k)}catch(e){delete _mem[k]}}};
const authStore={getItem:k=>ls.get(k),setItem:(k,v)=>ls.set(k,v),removeItem:k=>ls.del(k)};
let sb=null, user=null, saveTimer=null;
let syncedI=new Set(), syncedC=new Set(), syncedT=new Set();

function initClient(){
  try{ sb=createClient(SUPABASE.url,SUPABASE.key,{auth:{persistSession:true,autoRefreshToken:true,storage:authStore}}); return true; }
  catch(e){ return false; }
}
function chanFor(platform){
  const yt=channels.find(c=>/you ?tube/i.test(c.name)), ig=channels.find(c=>!/you ?tube/i.test(c.name));
  return ((platform==='youtube'?yt:ig)||channels[0]||{}).id||null;
}
const itemRow=i=>({id:i.id,user_id:user.id,channel_id:i.channel||chanFor(fmtOf(i).p),topic_id:i.topic||null,
  title:i.title||'',notes:i.notes||'',platform:fmtOf(i).p,format:i.format,status:i.status,
  pub_date:i.date||null,pub_time:i.date?(i.time||'19:00'):null,rec_date:i.recDate||null,rec_done:!!i.recDone});
const rowItem=r=>({id:r.id,channel:r.channel_id,topic:r.topic_id||'',title:r.title||'',notes:r.notes||'',
  format:FORMATS.some(f=>f.v===r.format)?r.format:(r.platform==='youtube'?'Vídeo longo':'Reels'),
  status:STAGES.some(s=>s.id===r.status)?r.status:(LEGACY[r.status]||'ideia'),
  date:r.pub_date||'',time:r.pub_time||'',recDate:r.rec_date||'',recDone:!!r.rec_done});

function setSync(st){
  const m={ok:['#00B368','salvo'],busy:['#FFB800','salvando…'],err:['#FF3B30','erro ao salvar'],warn:['#FFB800','salvo · dia de gravar só neste aparelho']}[st]||['#00B368','salvo'];
  ['#syncR','#syncM'].forEach(s=>{const el=$(s); if(el) el.innerHTML=`<i style="background:${m[0]}"></i>${m[1]}`;});
}
async function pull(){
  const [c,t,i]=await Promise.all([
    sb.from('channels').select('*').order('created_at',{ascending:true}),
    sb.from('topics').select('*').order('created_at',{ascending:true}),
    sb.from('items').select('*').order('created_at',{ascending:true})
  ]);
  if(c.error||t.error||i.error) throw (c.error||t.error||i.error);
  channels=(c.data||[]).map(r=>({id:r.id,name:r.name,color:r.color}));
  topics=(t.data||[]).map(r=>({id:r.id,name:r.name,color:r.color}));
  items=(i.data||[]).map(rowItem);
  syncedC=new Set(channels.map(x=>x.id)); syncedT=new Set(topics.map(x=>x.id)); syncedI=new Set(items.map(x=>x.id));
  if(i.data&&i.data.length&&!('rec_date' in i.data[0])){ missingCols.add('rec_date'); missingCols.add('rec_done'); ls.set('studio:missingCols',JSON.stringify([...missingCols])); }
  else if(i.data&&i.data.length&&('rec_date' in i.data[0])&&missingCols.has('rec_date')){ missingCols.delete('rec_date'); missingCols.delete('rec_done'); ls.set('studio:missingCols',JSON.stringify([...missingCols])); }
  loadRecLocal();
}
// colunas que o banco não tem (ex.: rec_date se o SQL de gravação não rodou) — o app pula elas
const OPT_COLS=['rec_date','rec_done','notes','pub_time'];
let missingCols=new Set(JSON.parse(ls.get('studio:missingCols')||'[]')), pushing=false, pushAgain=false, lastErr='';
const REC_KEY='studio:rec:v1';
function stripRow(r){ missingCols.forEach(c=>delete r[c]); return r; }
function saveRecLocal(){ // backup do dia de gravação no aparelho quando o banco não tem a coluna
  if(!missingCols.has('rec_date')) return;
  const m={}; items.forEach(i=>{ if(i.recDate||i.recDone) m[i.id]=[i.recDate,i.recDone]; }); ls.set(REC_KEY,JSON.stringify(m));
}
function loadRecLocal(){
  if(!missingCols.has('rec_date')) return;
  try{ const m=JSON.parse(ls.get(REC_KEY)||'{}'); items.forEach(i=>{ if(m[i.id]){ i.recDate=m[i.id][0]||''; i.recDone=!!m[i.id][1]; } }); }catch(e){}
}
function colFromErr(e){
  const t=(e&&(e.message||''))+' '+(e&&e.details||'');
  const m=t.match(/'(\w+)' column/)||t.match(/column "?(\w+)"? (?:of relation "?\w+"? )?does not exist/)||t.match(/column \w+\.(\w+) does not exist/);
  return m&&OPT_COLS.includes(m[1])?m[1]:null;
}
const errMsg=e=>(e&&(e.message||e.error_description||e.hint))||String(e||'erro');
async function up(table,rows){
  for(let k=0;k<OPT_COLS.length+1;k++){
    const r=await sb.from(table).upsert(rows.map(x=>stripRow({...x})));
    if(!r.error) return;
    const col=colFromErr(r.error);
    if(col&&!missingCols.has(col)){ missingCols.add(col); ls.set('studio:missingCols',JSON.stringify([...missingCols])); console.warn('coluna ausente no banco:',col); continue; }
    throw r.error;
  }
}
async function push(){
  if(!sb||!user) return;
  if(pushing){ pushAgain=true; return; }
  pushing=true; setSync('busy');
  try{
    const delI=[...syncedI].filter(id=>!items.some(x=>x.id===id));
    const delT=[...syncedT].filter(id=>!topics.some(x=>x.id===id));
    if(delI.length){const r=await sb.from('items').delete().in('id',delI); if(r.error) throw r.error;}
    if(delT.length){const r=await sb.from('topics').delete().in('id',delT); if(r.error) throw r.error;}
    if(channels.length) await up('channels',channels.map(c=>({id:c.id,user_id:user.id,name:c.name,color:c.color})));
    if(topics.length) await up('topics',topics.map(t=>({id:t.id,user_id:user.id,name:t.name,color:t.color})));
    if(items.length) await up('items',items.map(itemRow));
    syncedI=new Set(items.map(x=>x.id)); syncedC=new Set(channels.map(x=>x.id)); syncedT=new Set(topics.map(x=>x.id));
    saveRecLocal(); lastErr='';
    setSync(missingCols.has('rec_date')?'warn':'ok');
  }catch(e){
    lastErr=errMsg(e); setSync('err'); console.error(e);
    const auth=/jwt|token|auth|expired|401/i.test(lastErr);
    toast(auth?'Sessão expirou — saia e entre de novo':'Falha ao salvar: '+lastErr.slice(0,90));
    saveRecLocal();
  }finally{
    pushing=false;
    if(pushAgain){ pushAgain=false; setTimeout(push,200); }
  }
}
function save(){ clearTimeout(saveTimer); saveTimer=setTimeout(push,300); }
function ensureChannels(){
  if(!channels.length) channels=[
    {id:uid('ig_'),name:'Instagram',color:'#2563EB'},
    {id:uid('yt_'),name:'YouTube',color:'#0B0B0F'}
  ];
}

/* ===================== ACTIONS ===================== */
function newItem(pre){
  pre=pre||{};
  return {id:uid(),title:'',notes:'',format:pre.format||'Reels',status:pre.status||'ideia',topic:pre.topic||'',
    date:pre.date||'',time:pre.date?'19:00':'',recDate:pre.recDate||'',recDone:false,channel:null};
}
async function cycleItem(id){
  const it=items.find(x=>x.id===id); if(!it) return;
  const k=STAGES.findIndex(s=>s.id===it.status);
  it.status=STAGES[(k+1)%STAGES.length].id;
  it.recDone=it.status==='edicao'||it.status==='postado'?it.recDone||!!it.recDate:false;
  save(); renderAll(); toast(stage(it.status).n);
}
async function cycleDay(ds){
  const l=items.filter(i=>i.date===ds&&platOk(i,platCal)); if(!l.length) return false;
  const k=STAGES.findIndex(s=>s.id===l[0].status);
  const nx=STAGES[(k+1)%STAGES.length].id;
  l.forEach(i=>i.status=nx);
  save(); renderAll(); toast((l.length>1?l.length+' conteúdos → ':'')+stage(nx).n);
  return true;
}
async function recToggle(id){
  const it=items.find(x=>x.id===id); if(!it) return;
  if(it.recDone){ it.recDone=false; it.status='gravacao'; }
  else { it.recDone=true; it.status='edicao'; if(!it.recDate) it.recDate=today(); }
  save(); renderAll(); toast(it.recDone?'Gravado ✓ — foi pra Editar':'Voltou pra Gravar');
}
async function recSet(id,ds){
  const it=items.find(x=>x.id===id); if(!it) return;
  it.recDate=ds||''; if(ds&&it.status==='ideia') it.status='gravacao';
  save(); renderAll(); toast(ds?'Gravar '+relDay(ds)+' ('+fmtD(ds)+')':'Tirado da agenda de gravação');
}
async function planWeek(){
  const pend=items.filter(i=>needsRec(i)&&!i.recDate&&!i.recDone&&(recFilter==='all'||kindOf(i)===recFilter));
  if(!pend.length){ toast('Nada sem dia de gravação'); return; }
  const busy=new Set(items.filter(i=>i.recDate&&!i.recDone).map(i=>i.recDate));
  const free=skip=>{for(let k=0;k<30;k++){const d=dShift(today(),k); if(!busy.has(d)&&!skip.has(d)) return d;} return today();};
  const used=new Set(); const dR=free(used); used.add(dR); const dV=free(used);
  pend.forEach(i=>{ i.recDate=kindOf(i)==='video'?dV:dR; if(i.status==='ideia') i.status='gravacao'; });
  save(); renderAll();
  const nR=pend.filter(i=>kindOf(i)!=='video').length, nV=pend.length-nR;
  toast([nR?`${nR} Reel(s) ${fmtD(dR)}`:'',nV?`${nV} Vídeo(s) ${fmtD(dV)}`:''].filter(Boolean).join(' · '));
}

/* ===================== HOJE ===================== */
function renderHoje(){
  const t=today(), h=new Date().getHours();
  const nm=(user&&user.email?user.email.split('@')[0]:'').split(/[._\-\d]+/).filter(Boolean)[0]||'';
  const dl=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  $('#hojeDate').textContent=dl.charAt(0).toUpperCase()+dl.slice(1);
  $('#hojeHello').textContent=(h<12?'Bom dia':h<18?'Boa tarde':'Boa noite')+(nm?', '+nm.charAt(0).toUpperCase()+nm.slice(1):'');

  const pend=items.filter(i=>needsRec(i)&&i.recDate&&i.recDate<=t&&!i.recDone).sort((a,b)=>a.recDate.localeCompare(b.recDate));
  const done=items.filter(i=>i.recDone&&i.recDate===t);
  const list=pend.concat(done);
  const mins=pend.reduce((s,i)=>s+kindOb(i).min,0);
  const nR=pend.filter(i=>kindOf(i)==='reel').length, nV=pend.filter(i=>kindOf(i)==='video').length;
  $('#cRec').innerHTML=`<div class="card-h"><div class="ic" style="background:#E8EFFD">🎬</div><h2>Gravar hoje</h2>
      <span class="n">${pend.length||''}</span><button class="lnk" data-go="gravar">Ver tudo</button></div>
    ${list.length?list.map(i=>`<div class="row ${i.recDone?'done':''}">
        <button class="chk ${i.recDone?'on':''}" data-rchk="${i.id}" aria-label="Gravado">${ICON.check}</button>
        <div class="tx" data-open="${i.id}"><p>${esc(i.title)||'Sem título'}</p>
        <small>${kbHTML(i)}${topic(i.topic)?`<span class="tp">${esc(topic(i.topic).name)}</span>`:''}${i.recDate<t?'<span class="late">atrasado</span>':''}</small></div></div>`).join('')
      +(pend.length?`<div class="card-f">⏱ ~${hhmm(mins)} de gravação${nR?` · ${nR} Reel${nR>1?'s':''}`:''}${nV?` · ${nV} Vídeo${nV>1?'s':''}`:''}</div>`:`<div class="card-f">Tudo gravado hoje 🎉</div>`)
    :`<div class="empty"><div class="em">☕</div><b>Nada pra gravar hoje</b><p>Escolha ideias e marque o dia de gravar.</p>
      <button class="btn btn-soft btn-sm" data-go="gravar">Planejar gravações</button></div>`}`;

  const wk=dShift(t,7);
  $('#tWeek').textContent=items.filter(i=>i.date&&i.date>=t&&i.date<=wk&&i.status!=='postado').length;
  $('#tIdeas').textContent=items.filter(i=>i.status!=='postado').length;

  const next=items.filter(i=>i.date&&i.date>=t&&i.status!=='postado').sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''))).slice(0,5);
  $('#cNext').innerHTML=`<div class="card-h"><div class="ic" style="background:#E9F8F1">📅</div><h2>Próximos posts</h2><button class="lnk" data-go="cal">Agenda</button></div>
    ${next.length?next.map(i=>{const[,m,d]=i.date.split('-'),s=stage(i.status);
      return `<div class="row"><div class="dbox"><b>${d}</b><i>${MONTHS[+m-1].slice(0,3).toUpperCase()}</i></div>
      <div class="tx" data-open="${i.id}"><p>${esc(i.title)||'Sem título'}</p><small>${kbHTML(i)}<span>${relDay(i.date)}</span></small></div>
      <span class="kb" style="background:${s.c}1F;color:${s.c}">${s.n}</span></div>`}).join('')
    :`<div class="empty"><div class="em">🗓️</div><b>Nenhum post agendado</b><p>Abra uma ideia e escolha o dia de postar.</p></div>`}`;
}

  $('#stFilter').innerHTML=[{id:'all',n:'Todas'}].concat(STAGES).map(s=>`<button data-st="${s.id}" class="${stFilter===s.id?'on':''}">${s.n}</button>`).join('');
  $$('#stFilter button').forEach(b=>b.onclick=()=>{stFilter=b.dataset.st;renderIdeias()});
  $('#topicChips').innerHTML=`<button class="chip ${topicFilter==='all'?'on':''}" data-tf="all">Todos os itens</button>`
    +topics.map(t=>`<button class="chip ${topicFilter===t.id?'on':''}" data-tf="${t.id}"><span style="width:8px;height:8px;border-radius:50%;background:${t.color}"></span>${esc(t.name)}</button>`).join('')
    +`<button class="chip add" id="addTopic">+ Item</button>`;
  $$('#topicChips [data-tf]').forEach(b=>b.onclick=()=>{topicFilter=b.dataset.tf;renderIdeias()});
  $('#addTopic').onclick=()=>{
    const b=$('#addTopic'); b.outerHTML=`<span class="chip on" style="background:#fff;color:var(--txt);box-shadow:inset 0 0 0 1.5px var(--blue)"><input id="topicIn" placeholder="Ex: Forno novo"></span>`;
    const inp=$('#topicIn'); inp.focus();
    let fin=false; const done=()=>{if(fin)return; fin=true; const v=inp.value.trim(); if(v){const t={id:uid('t'),name:v,color:TOPIC_COLORS[topics.length%TOPIC_COLORS.length]};topics.push(t);topicFilter=t.id;save();toast('Item criado: '+v)} renderIdeias();};
    inp.onkeydown=e=>{if(e.key==='Enter')done(); if(e.key==='Escape'){inp.value='';done()}};
    inp.onblur=done;

  if(stFilter!=='all') l=l.filter(i=>i.status===stFilter);
  if(topicFilter!=='all') l=l.filter(i=>i.topic===topicFilter);
  if(query) l=l.filter(i=>(i.title+' '+i.notes).toLowerCase().includes(query));
  const ord=s=>STAGES.findIndex(x=>x.id===s);
  l.sort((a,b)=>ord(a.status)-ord(b.status)||(b.id>a.id?1:-1));
  $('#ideasN').textContent=items.length||'';
  $('#ideasList').innerHTML=l.length?l.map((i,k)=>{const s=stage(i.status),tp=topic(i.topic);
    return `<div class="icard ${picked.has(i.id)?'picked':''}" data-open="${i.id}"><span class="sel">${ICON.check}</span>
      <div class="top"><button class="spill" data-cyc="${i.id}" style="background:${s.c}1F;color:${s.c}" title="Toque pra avançar"><i style="background:${s.c}"></i>${s.n}</button>
        ${kbHTML(i)}${tp?`<span class="tp">${esc(tp.name)}</span>`:''}</div>
      <h3>${esc(i.title)||'<span style="color:var(--txt-3)">Sem título</span>'}</h3>
      ${i.notes?`<div class="pv">${esc(i.notes)}</div>`:''}
      ${i.recDate||i.date?`<div class="ft">${i.recDate?`<span>🎬 ${i.recDone?'gravado':'grava'} ${fmtD(i.recDate)}</span>`:''}${i.date?`<span>📅 posta ${fmtD(i.date)}</span>`:''}</div>`:''}
    </div>`}).join('')
    :(items.length?`<div class="card empty"><div class="em">🔎</div><b>Nada aqui</b><p>Nenhuma ideia com esse filtro.</p></div>`
      :`<div class="card empty"><div class="em">💡</div><b>Nenhuma ideia ainda</b><p>Toque em <b style="display:inline;font-size:inherit">+</b> pra anotar a primeira.</p>
        <button class="btn btn-blue btn-sm" data-new>Anotar ideia</button></div>`);
  $$('#ideasList [data-cyc]').forEach(b=>b.onclick=e=>{e.stopPropagation();cycleItem(b.dataset.cyc)});
  wireCommon('#v-ideias');
  lastVisible=l.map(i=>i.id);
  $$('#ideasList .icard').forEach(c=>{
    const id=c.dataset.open;
    if(selecting) c.onclick=()=>{ if(Date.now()-lpAt<700) return; togglePick(id); };
    // segurar o dedo (ou clicar com Ctrl/Shift) começa a seleção
    let t=null;
    c.addEventListener('touchstart',()=>{t=setTimeout(()=>{t=null; if(!selecting){lpAt=Date.now();setSelecting(true);togglePick(id); if(navigator.vibrate)navigator.vibrate(15);}},450)},{passive:true});
    ['touchend','touchmove','touchcancel'].forEach(ev=>c.addEventListener(ev,()=>{if(t){clearTimeout(t);t=null}},{passive:true}));
    c.addEventListener('click',e=>{if(!selecting&&(e.ctrlKey||e.metaKey||e.shiftKey)){e.preventDefault();e.stopImmediatePropagation();setSelecting(true);togglePick(id);}},true);
  });
  syncSelbar();
}

/* ---------- seleção múltipla ---------- */
function setSelecting(on){
  selecting=on; if(!on) picked.clear();
  document.body.classList.toggle('selecting',on);
  $('#selBtn').textContent=on?'Cancelar':'Selecionar';
  renderIdeias();
}
function togglePick(id){ picked.has(id)?picked.delete(id):picked.add(id); renderIdeias(); }
function syncSelbar(){
  const n=picked.size;
  $('#selN').textContent=n?`${n} selecionada${n>1?'s':''}`:'Toque nas ideias';
  const all=lastVisible.length&&lastVisible.every(id=>picked.has(id));
  $('#selAll').textContent=all?'Nenhuma':'Todas';
  $$('.selacts .sa').forEach(x=>x.classList.toggle('off',!n));

function dayOpts(){

function recDay(ds,l){
  const t=today(), atr=ds&&ds<t;
  const mins=l.filter(i=>!i.recDone).reduce((s,i)=>s+kindOb(i).min,0);
  const sets=['reel','video'].map(k=>{const x=l.filter(i=>kindOf(i)===k); if(!x.length) return '';
    const K=KINDS[k],p=x.filter(i=>!i.recDone).length;
    return `<div class="rset"><div class="rset-h" style="color:${K.c}">${K.ic} ${K.n}s · ${x.length}<i>${K.setup}${p?` · ~${hhmm(p*K.min)}`:' · tudo gravado ✓'}</i></div>${x.map(recRow).join('')}</div>`}).join('');
  return `<div class="rday"><div class="rday-h ${ds===t?'hoje':''} ${atr?'atr':''}">
    <h3>${ds?(ds===t?'Hoje':ds===dShift(t,1)?'Amanhã':fmtD(ds)):'Sem dia de gravação'}</h3>
    <span class="w">${ds?(atr?'atrasado':(ds===t||ds===dShift(t,1)?fmtD(ds):relDay(ds))):''}</span>

function gridHTML(y,m){
  const first=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate(), prev=new Date(y,m,0).getDate(), t=today();
  let h=DOW.map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=first-1;i>=0;i--) h+=`<div class="day out"><div class="dn"><b>${prev-i}</b></div></div>`;
  for(let d=1;d<=days;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const l=items.filter(i=>i.date===ds&&platOk(i,platCal)).reverse();
    const c=l.length?stage(l[0].status).c:null;
    h+=`<div class="day ${ds===t?'today':''}" data-date="${ds}" style="${c?`border-color:${c};background:${c}24`:''}"
        title="${l.length?'Clique no dia pra avançar a etapa':'Clique pra criar ideia neste dia'}">
      <div class="dn"><b>${d}</b><button class="plus" data-addday="${ds}" title="Nova ideia neste dia">+</button></div>
      <div class="pills">${l.map(i=>`<div class="pill" draggable="${isTouch?'false':'true'}" data-pid="${i.id}" title="${esc(i.title)}" style="border-left-color:${platOf(i)==='yt'?'#FF0033':'#2563EB'}">${esc(i.title)||'Sem título'}</div>`).join('')}</div>
    </div>`;
  }
  const rest=(7-((first+days)%7))%7;
  for(let i=1;i<=rest;i++) h+=`<div class="day out"><div class="dn"><b>${i}</b></div></div>`;
  return h;
}
function wireDrag(el,hadDate){
  el.ondragstart=e=>{e.dataTransfer.setData('text/plain',el.dataset.pid);el.classList.add('drag');calDropOk=false};
  el.ondragend=()=>{el.classList.remove('drag');
    if(hadDate&&!calDropOk){const it=items.find(x=>x.id===el.dataset.pid); if(it&&it.date){it.date='';it.time='';save();renderAll();toast('Tirado da agenda');}}};
  el.onclick=e=>{e.stopPropagation();openEditor(el.dataset.pid)};
}
function fitPills(root){
  // diminui a letra até o título inteiro caber no quadrado
  const min=isTouch||innerWidth<=820?7.5:9.5;
  root.querySelectorAll('.pill').forEach(el=>{
    el.style.fontSize=''; el.style.overflowWrap=''; let fs=parseFloat(getComputedStyle(el).fontSize);
    const over=()=>el.scrollHeight>el.clientHeight+1||el.scrollWidth>el.clientWidth+1;
    while(over()&&fs>min){ fs-=.5; el.style.fontSize=fs+'px'; }
    if(over()){ el.style.hyphens='auto'; el.style.overflowWrap='anywhere'; } // último recurso: palavra gigante
  });
}
function wireGrid(root){
  fitPills(root);
  root.querySelectorAll('.pill').forEach(el=>wireDrag(el,true));
  root.querySelectorAll('[data-addday]').forEach(b=>b.onclick=e=>{e.stopPropagation();openEditor(null,{date:b.dataset.addday})});
  root.querySelectorAll('.day[data-date]').forEach(day=>{
    day.ondragover=e=>{e.preventDefault();day.classList.add('drop')};
    day.ondragleave=()=>day.classList.remove('drop');
    day.ondrop=e=>{e.preventDefault();day.classList.remove('drop');calDropOk=true;
      const it=items.find(x=>x.id===e.dataTransfer.getData('text/plain'));
      if(it){it.date=day.dataset.date; if(!it.time) it.time='19:00'; save(); renderAll(); toast('Posta '+relDay(it.date)+' ('+fmtD(it.date)+')');}};
    day.onclick=async()=>{ if(!(await cycleDay(day.dataset.date))) openEditor(null,{date:day.dataset.date}); };
  });
}
function blockHTML(off){const d=new Date(calDate.getFullYear(),calDate.getMonth()+off,1);
  return `<div class="cal-block"><h3>${MONTHS[d.getMonth()]} ${d.getFullYear()}</h3><div class="cal">${gridHTML(d.getFullYear(),d.getMonth())}</div></div>`;}
function renderCal(){
  const y=calDate.getFullYear(), m=calDate.getMonth();
  $('#monthLbl').textContent=MONTHS[m]+' '+y;
  $('#calMode').textContent=calMode==='grid'?'Roleta':'Um mês';
  platSeg('#platCal',platCal,v=>{platCal=v;renderCal()});
  if(calMode==='grid'){
    $('#calScroll').classList.add('hide'); $('#calScroll').innerHTML=''; $('#cal').classList.remove('hide');
    $('#cal').innerHTML=gridHTML(y,m); wireGrid($('#cal'));
  }else{
    $('#cal').classList.add('hide'); $('#cal').innerHTML=''; const sc=$('#calScroll'); sc.classList.remove('hide');
    let h=''; for(let o=calFrom;o<=calTo;o++) h+=blockHTML(o);
    const keep=sc.scrollTop; sc.innerHTML=h; sc.scrollTop=keep; wireGrid(sc);
    sc.onscroll=()=>{
      if(sc.scrollTop<60&&calFrom>-60){calFrom--;const ph=sc.scrollHeight;sc.insertAdjacentHTML('afterbegin',blockHTML(calFrom));sc.scrollTop+=sc.scrollHeight-ph;wireGrid(sc);}
      if(sc.scrollTop+sc.clientHeight>sc.scrollHeight-200&&calTo<60){calTo++;sc.insertAdjacentHTML('beforeend',blockHTML(calTo));wireGrid(sc);}
    };
  }
  $('#legend').innerHTML=STAGES.map(s=>`<span><i style="background:${s.c}"></i>${s.n}</span>`).join('')+'<span style="color:var(--txt-3)">· clique no dia pra avançar</span>';
  const nd=items.filter(i=>!i.date&&i.status!=='postado'&&platOk(i,platCal)).reverse();
  $('#trayHint').textContent=isTouch?'Abra a ideia e escolha o dia de postar.':'Arraste pra um dia pra agendar.';
  $('#tray').innerHTML=nd.length?nd.map(i=>`<div class="titem" draggable="${isTouch?'false':'true'}" data-pid="${i.id}"><p>${esc(i.title)||'Sem título'}</p><small>${esc(fmtOf(i).n)} · ${stage(i.status).n}</small></div>`).join('')
    :`<div class="empty" style="padding:14px 0"><p>Tudo agendado 🎉</p></div>`;
  $$('#tray .titem').forEach(el=>wireDrag(el,false));
}
$('#main').addEventListener('scroll',()=>{
  if(view!=='cal'||calMode==='grid') return;
  const sc=$('#calScroll'), mn=$('#main');

  if(mn.scrollTop+mn.clientHeight>mn.scrollHeight-300&&calTo<60){calTo++;sc.insertAdjacentHTML('beforeend',blockHTML(calTo));wireGrid(sc);}

    stFilter='all'; topicFilter='all'; query=''; $('#q').value='';
    ensureChannels(); await push();
    $('#meVeil').classList.remove('on'); renderAll(); go('hoje'); toast('Tudo apagado. Começando do zero ✨');
  }catch(e){ console.error(e); toast('Não deu pra apagar: '+(e.message||'erro')); }
  b.textContent='Apagar tudo pra sempre';
};

/* ===================== COMMON ===================== */
function wireCommon(root){
  $$(root+' [data-open]').forEach(el=>el.onclick=()=>openEditor(el.dataset.open));
  $$(root+' [data-rchk]').forEach(b=>b.onclick=e=>{e.stopPropagation();recToggle(b.dataset.rchk)});
  $$(root+' [data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  $$(root+' [data-new]').forEach(b=>b.onclick=()=>openEditor(null,newPre()));
}
function newPre(){ return view==='gravar'?{status:'gravacao',recDate:today()}:{}; }
function badges(){
  const t=today(), n=items.filter(i=>needsRec(i)&&i.recDate&&i.recDate<=t&&!i.recDone).length;
  $$('[data-nb]').forEach(b=>b.textContent=n?String(n):'');
  const a=((user&&user.email)||'?').charAt(0);
  $$('.av').forEach(x=>x.textContent=a);
  $('#meMail').textContent=(user&&user.email)||'—';
}
function renderAll(){ fillBulk(); renderHoje(); wireCommon('#v-hoje'); renderIdeias(); renderGravar(); renderCal(); badges(); }

$('#q').oninput=e=>{query=e.target.value.toLowerCase().trim();renderIdeias()};
$('#fab').onclick=()=>openEditor(null,newPre());
$('#railNew').onclick=()=>openEditor(null,newPre());
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(!$('#edVeil').classList.contains('on')&&!$('#meVeil').classList.contains('on')&&selecting) setSelecting(false); closeEditor();$('#meVeil').classList.remove('on')}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='n'){e.preventDefault();openEditor(null,newPre())}
  if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&$('#edVeil').classList.contains('on')){e.preventDefault();$('#edSave').click()}
});

/* ===================== LOGIN ===================== */
const gate=()=>$('#gate');
function gErr(m){const e=$('#logErr'); e.textContent=m||''; e.style.display=m?'block':'none';}
async function startSession(u){
  user=u;
  try{ await pull(); }catch(e){ toast('Erro ao carregar dados'); console.error(e); }
  if(!channels.length){ ensureChannels(); await push(); }
  setSync('ok'); gate().classList.remove('on'); renderAll();
}
let signMode='in';
$$('#authSeg button').forEach(b=>b.onclick=()=>{signMode=b.dataset.auth;$$('#authSeg button').forEach(x=>x.classList.toggle('on',x===b));
  $('#doAuth').textContent=signMode==='in'?'Entrar':'Criar conta';gErr('')});
$('#doAuth').onclick=async()=>{
  const email=$('#logMail').value.trim(), pass=$('#logPass').value;
  if(!email||!pass) return gErr('Preencha e-mail e senha.');
  if(pass.length<6) return gErr('Senha precisa de 6+ caracteres.');
  const btn=$('#doAuth'); btn.textContent='…'; gErr('');
  try{
    const {data,error}=await (signMode==='in'?sb.auth.signInWithPassword({email,password:pass}):sb.auth.signUp({email,password:pass}));
    if(error) throw error;
    if(!data.session) gErr('Confirme o e-mail que enviamos e entre de novo.');
    else await startSession(data.session.user);
  }catch(e){ gErr(e.message||'Não deu certo.'); }
  btn.textContent=signMode==='in'?'Entrar':'Criar conta';
};
$('#logPass').onkeydown=e=>{if(e.key==='Enter')$('#doAuth').click()};
$('#logout').onclick=async()=>{
  if(sb) await sb.auth.signOut();
  user=null; items=[]; channels=[]; topics=[]; syncedI=new Set(); syncedC=new Set(); syncedT=new Set();
  $('#meVeil').classList.remove('on'); renderAll(); gate().classList.add('on');
};

addEventListener('resize',()=>{clearTimeout(window._rz);window._rz=setTimeout(()=>{if(view==='cal')fitPills($('#v-cal'))},150)});
/* clique em qualquer botão de data abre o calendário (no computador o campo invisível não abria sozinho) */
document.addEventListener('click',e=>{
  const lab=e.target.closest('.echip,.datechip,.sa'); if(!lab) return;
  const inp=lab.querySelector('input[type=date]'); if(!inp) return;
  if(typeof inp.showPicker==='function'){ e.preventDefault(); try{ inp.showPicker(); }catch(err){ inp.focus(); } }
},true);
/* ===================== BOOT ===================== */
buildNav(); go('hoje');
(async()=>{
  try{
    const mf={name:'Studio',short_name:'Studio',start_url:'.',display:'standalone',background_color:'#F2F2F7',theme_color:'#F2F2F7',
      icons:[{src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='120' fill='%230B0B0F'/%3E%3Crect x='176' y='176' width='160' height='160' rx='44' fill='%232563EB'/%3E%3C/svg%3E",sizes:'512x512',type:'image/svg+xml',purpose:'any'}]};
    const l=document.createElement('link'); l.rel='manifest'; l.href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:'application/manifest+json'})); document.head.appendChild(l);
  }catch(e){}
  gate().classList.add('on');
  if(!initClient()){ gErr('Não consegui conectar. Recarregue a página.'); return; }
  try{ const {data}=await sb.auth.getSession(); if(data&&data.session) await startSession(data.session.user); }catch(e){}
})();
</script>
